<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>TillLock Closeout</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p>Branch cash assurance</p><h1>TillLock Closeout</h1><span>Reconcile cash, record adjustments, submit closeouts, and preserve manager approval evidence.</span></div><label>Working role<select id="role"><option value="cashier-local">Cashier</option><option value="manager-local">Branch manager</option><option value="auditor-local">Finance auditor</option></select></label></header><section id="notice"></section><section class="metrics"><b id="open">0<small>Open</small></b><b id="submitted">0<small>Submitted</small></b><b id="approved">0<small>Approved</small></b></section><section class="forms"><form id="open-form"><h2>Open closeout</h2><input name="branch" placeholder="Banani Branch" required><input name="register" placeholder="Register R-01" required><input name="expected" type="number" placeholder="Expected cash" required><input name="counted" type="number" placeholder="Counted cash" required><button>Open closeout</button></form><form id="adjust-form"><h2>Record adjustment</h2><select name="id" id="adjust-id"></select><input name="reason" placeholder="Refund receipt reference" required><input name="amount" type="number" placeholder="Adjustment amount" required><button>Record adjustment</button></form><form id="approve-form"><h2>Submit and approve</h2><select name="id" id="approve-id"></select><textarea name="note" placeholder="Manager review note"></textarea><button id="submit">Submit selected</button><button id="approve" type="button">Approve selected</button></form></section><section><h2>Closeout register</h2><table><thead><tr><th>Branch</th><th>Register</th><th>Expected</th><th>Counted</th><th>Variance</th><th>Status</th></tr></thead><tbody id="sessions"></tbody></table></section><section><h2>Evidence trail</h2><ol id="audits"></ol></section></main><script src="renderer.js"></script></body></html>
